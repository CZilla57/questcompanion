openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FocusQuest API - ADHD gamified task tracker
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: users
    description: User profile and stats
  - name: tasks
    description: Task management
  - name: recurring
    description: Recurring task templates
  - name: badges
    description: Badges and achievements
  - name: accountability
    description: Accountability partner system
  - name: leaderboard
    description: Leaderboard and rankings
  - name: calendar
    description: Calendar heatmap data
  - name: focus
    description: Focus sessions and Pomodoro timer
  - name: questlines
    description: Grouping quests into goal-oriented questlines
  - name: campaigns
    description: Long-horizon goals told as an ordered story arc over questlines
  - name: brain
    description: Brain check-ins, derived mode state, and rescue events
  - name: recaps
    description: Weekly AI recap archive and email settings
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid hero name format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Hero name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rename cooldown active
          content:
            application/json:
              schema:
                type: object
                required: [error, renameAvailableAt]
                properties:
                  error:
                    type: string
                  renameAvailableAt:
                    type: string
                    format: date-time

  /users/me/stats:
    get:
      operationId: getMyStats
      tags: [users]
      summary: Get current user dashboard stats
      parameters:
        - name: tz
          in: query
          description: >-
            IANA timezone (e.g. "America/New_York") used to determine the user's
            local "today". Defaults to UTC when omitted or invalid.
          schema:
            type: string
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  /users/me/hero-status:
    get:
      operationId: getHeroStatus
      tags: [users]
      summary: Hero hunger stage, mood, and current ambient activity
      responses:
        "200":
          description: Hero care status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroStatus"

  /users/me/kingdoms:
    get:
      operationId: getKingdoms
      summary: Life Kingdoms state — structure tiers, derived liveliness, and the neglect invitation
      tags: [users]
      responses:
        "200":
          description: Kingdom state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KingdomsResponse"
        "401":
          description: Unauthorized

  /users/me/xp-history:
    get:
      operationId: getMyXpHistory
      tags: [users]
      summary: Get daily XP earned for the past N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
        - name: tz
          in: query
          description: >-
            IANA timezone (e.g. "America/New_York") used to bucket XP by the
            user's local calendar day. Defaults to UTC when omitted or invalid.
          schema:
            type: string
      responses:
        "200":
          description: XP history per day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/XpDataPoint"

  /users/me/insights:
    get:
      operationId: getMyInsights
      tags: [users]
      summary: Get pattern insights for the current user
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
        - name: tz
          in: query
          description: >-
            IANA timezone (e.g. "America/New_York") used to bucket stats by the
            user's local calendar day and hour. Defaults to UTC when omitted or invalid.
          schema:
            type: string
      responses:
        "200":
          description: Insights data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"

  /users/me/patterns:
    get:
      operationId: getMyPatterns
      tags: [users]
      summary: Derived 28-day pattern summary (power hours, durations, modes, chips)
      parameters:
        - name: tz
          in: query
          description: >-
            IANA timezone fallback used only when the user has no persisted
            timezone. Defaults to UTC when omitted or invalid.
          schema:
            type: string
      responses:
        "200":
          description: Pattern summary (always complete; confidence gates rendering)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternSummary"

  /reflections/today:
    get:
      operationId: getTodayReflection
      tags: [reflections]
      summary: Get today's reflection; drafts the question only when draft=true
      parameters:
        - name: tz
          in: query
          schema:
            type: string
        - name: draft
          in: query
          description: >-
            When true, drafts (and persists) today's question if none exists —
            the reflection page passes true; the dashboard card omits it so
            LLM drafting stays lazy.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Today's reflection, or null when none exists and draft=false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionResponse"
    post:
      operationId: answerTodayReflection
      tags: [reflections]
      summary: Answer (or same-day re-answer) today's reflection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionAnswerRequest"
      responses:
        "200":
          description: Saved answer with warm ack; xpAwarded is 5 on first answer, else 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionAnswerResponse"
        "400":
          description: Unknown chip, empty answer (no chips and no freeText), or freeText over 500 chars

  /recaps:
    get:
      operationId: getMyRecaps
      tags: [recaps]
      summary: Past weekly recaps (newest first) plus email settings state
      responses:
        "200":
          description: Recap archive; skipped (zero-signal) weeks are excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapsResponse"

  /users/me/recap-emails:
    patch:
      operationId: updateRecapEmailSettings
      tags: [recaps]
      summary: Enable or disable the weekly recap email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecapEmailSettingsRequest"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapEmailSettingsResponse"
        "400":
          description: enabled must be a boolean

  /users/me/notification-prefs:
    get:
      operationId: getNotificationPrefs
      tags: [notifications]
      summary: Per-category push preferences and quiet hours
      responses:
        "200":
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefs"
        "401":
          description: Unauthorized
    put:
      operationId: updateNotificationPrefs
      tags: [notifications]
      summary: Replace push preferences and quiet hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPrefs"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefs"
        "400":
          description: Invalid body
        "401":
          description: Unauthorized

  /recaps/unsubscribe:
    get:
      operationId: unsubscribeRecapEmails
      tags: [recaps]
      summary: One-click email unsubscribe (unauthenticated, tokenized)
      description: >-
        Looks up the token and disables recap emails for that user. Always
        returns the same friendly HTML page — valid or not — so the endpoint
        is not a token oracle. Linked from every recap email footer and the
        List-Unsubscribe header; not consumed by the app client.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmation page
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: unsubscribeRecapEmailsOneClick
      tags: [recaps]
      summary: RFC 8058 one-click unsubscribe (unauthenticated, tokenized)
      description: >-
        Same effect as the GET endpoint, exposed as a POST for mail clients
        that submit a form-encoded List-Unsubscribe=One-Click body per RFC
        8058. The token is read from the query string only; the request body
        is never parsed. Not consumed by the app client.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmation page
          content:
            text/html:
              schema:
                type: string

  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List tasks for the current user
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by date (YYYY-MM-DD). Defaults to today.
        - name: completed
          in: query
          schema:
            type: ["boolean", "null"]
        - name: category
          in: query
          schema:
            type: string
            enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
          description: Filter by category
        - name: tz
          in: query
          required: false
          description: IANA timezone; enables local-day adaptive-difficulty offer flags on returned quests
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "200":
          description: Replay of an existing capture (same user + clientKey) - the existing task, no new row created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/parse:
    post:
      operationId: parseQuickAdd
      tags: [tasks]
      summary: Parse a natural-language quick-add line into structured task fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseQuickAddInput"
      responses:
        "200":
          description: Parsed fields (does not create a task)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedQuickAdd"
        "429":
          description: Cooldown — too many parse requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Model or parse failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI parse not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/transcribe:
    post:
      operationId: transcribeAudio
      tags: [tasks]
      summary: Transcribe a short voice clip into Quick-Add text
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Transcript (may be empty for silent audio)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResult"
        "400":
          description: Missing or unsupported audio body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Cooldown — too many transcription requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Transcription provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Voice transcription not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task complete and award points
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completion result with points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCompletionResult"

  /recurring-tasks:
    get:
      operationId: getRecurringTasks
      tags: [recurring]
      summary: List all recurring task templates
      responses:
        "200":
          description: Recurring tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringTask"
    post:
      operationId: createRecurringTask
      tags: [recurring]
      summary: Create a recurring task template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskInput"
      responses:
        "201":
          description: Created recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"

  /recurring-tasks/{id}:
    get:
      operationId: getRecurringTask
      tags: [recurring]
      summary: Get a single recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"
    patch:
      operationId: updateRecurringTask
      tags: [recurring]
      summary: Update a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskUpdate"
      responses:
        "200":
          description: Updated recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"
    delete:
      operationId: deleteRecurringTask
      tags: [recurring]
      summary: Delete a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /recurring-tasks/{id}/toggle:
    post:
      operationId: toggleRecurringTask
      tags: [recurring]
      summary: Enable or disable a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"

  /tasks/{id}/uncomplete:
    post:
      operationId: uncompleteTask
      tags: [tasks]
      summary: Mark a task as incomplete (undo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/focus:
    patch:
      operationId: patchTaskFocus
      tags: [tasks]
      summary: Pin or unpin a task as a daily focus quest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusToggleInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation error (e.g. already 3 focus quests today)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/momentum:
    get:
      operationId: getTasksMomentum
      tags: [tasks]
      summary: Mode- and time-aware next-win suggestions (supersedes /tasks/recommend)
      parameters:
        - name: minutes
          in: query
          schema:
            type: ["integer", "null"]
          description: Available minutes right now (optional)
        - name: tz
          in: query
          schema:
            type: string
          description: IANA timezone for local-hour and local-day scoring
        - name: exclude
          in: query
          schema:
            type: string
          description: Comma-separated task IDs to exclude (skip loop)
      responses:
        "200":
          description: Ranked suggestions, primary first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentumResponse"

  /brain/state:
    get:
      operationId: getBrainState
      tags: [brain]
      summary: Current derived brain mode (4h TTL, local-day bound)
      parameters:
        - name: tz
          in: query
          schema:
            type: string
          description: IANA timezone for expiry and checkedInToday derivation
      responses:
        "200":
          description: Derived state — single source of truth for chip, board, momentum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainState"

  /brain/checkins:
    post:
      operationId: createBrainCheckin
      tags: [brain]
      summary: One-tap brain check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainCheckinRequest"
      responses:
        "201":
          description: Derived state after this check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainState"
        "422":
          description: Unknown mode or source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/me/timezone:
    put:
      operationId: putMyTimezone
      tags: [users]
      summary: Persist the user's IANA timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimezoneInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean } }
        "400":
          description: Missing or invalid timezone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/me/hyperfocus/pause:
    post:
      operationId: pauseHyperfocus
      tags: [users]
      summary: Pause (or resume) hyperfocus protection nudges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HyperfocusPauseInput"
      responses:
        "200":
          description: New paused-until (null when resumed)
          content:
            application/json:
              schema:
                type: object
                required: [pausedUntil]
                properties:
                  pausedUntil:
                    type: ["string", "null"]
                    format: date-time
        "400":
          description: Invalid minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /rescue/events:
    post:
      operationId: createRescueEvent
      tags: [brain]
      summary: Log a taken rescue intervention (fire-and-forget)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescueEventRequest"
      responses:
        "201":
          description: Logged
          content:
