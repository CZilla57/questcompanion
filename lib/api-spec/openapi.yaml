      properties:
        session:
          $ref: "#/components/schemas/FocusSession"
        xpDelta:
          type: integer

    StartFocusSessionInput:
      type: object
      required: [preset]
      properties:
        preset:
          type: string
          enum: [classic, deep, short]
        taskId:
          type: integer
          description: Optional quest to focus on

    FocusIntervalInput:
      type: object
      required: [intervalIndex]
      properties:
        intervalIndex:
          type: integer
          minimum: 1
          description: 1-based index of the focus interval that just completed

    FocusCompleteInput:
      type: object
      properties:
        partialSeconds:
          type: integer
          minimum: 0
          description: Seconds focused in the in-progress interval when stopping mid-focus

    WeeklyRecapStats:
      type: object
      required: [weekKey, questsCompleted, sampleQuestTitles, focusSessions, focusMinutes, xpEarned, coinsEarned, initiations, levelUps, badges, questlinesCompleted, boss, rhythms]
      properties:
        weekKey: { type: string }
        questsCompleted: { type: integer }
        sampleQuestTitles:
          type: array
          items: { type: string }
        focusSessions: { type: integer }
        focusMinutes: { type: integer }
        xpEarned: { type: integer }
        coinsEarned: { type: integer }
        initiations: { type: integer }
        levelUps: { type: integer }
        badges:
          type: array
          items: { type: string }
        questlinesCompleted:
          type: array
          items: { type: string }
        boss:
          type: ["object", "null"]
          required: [damage, attacks, defeated]
          properties:
            damage: { type: integer }
            attacks: { type: integer }
            defeated: { type: boolean }
        rhythms:
          type: ["object", "null"]
          required: [powerHours, bestDay, topHelpers]
          properties:
            powerHours:
              type: array
              items: { type: integer }
            bestDay: { type: ["integer", "null"] }
            topHelpers:
              type: array
              items: { type: string }

    WeeklyRecapItem:
      type: object
      required: [weekKey, stats, narrative, sentAt]
      properties:
        weekKey: { type: string }
        stats:
          $ref: "#/components/schemas/WeeklyRecapStats"
        narrative: { type: string }
        sentAt:
          type: ["string", "null"]
          format: date-time
          description: Null when the recap was generated but not emailed

    RecapsResponse:
      type: object
      required: [emailEnabled, emailKnown, recaps]
      properties:
        emailEnabled: { type: boolean }
        emailKnown:
          type: boolean
          description: False until an email address has been captured at login
        recaps:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyRecapItem"

    RecapEmailSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    RecapEmailSettingsResponse:
      type: object
      required: [emailEnabled]
      properties:
        emailEnabled: { type: boolean }

    NotificationPrefs:
      type: object
      required: [protection, reminders, reflection, hero, quietHoursStart, quietHoursEnd]
      additionalProperties: false
      properties:
        protection:
          type: boolean
          description: Hyperfocus self-care nudges (may fire late by design)
        reminders:
          type: boolean
          description: Context nudges — due today, power window, quick win
        reflection:
          type: boolean
          description: Evening reflection prompt
        hero:
          type: boolean
          description: Hero care — hunger warnings, milestones, flavor
        quietHoursStart:
          type: integer
          minimum: 0
          maximum: 23
        quietHoursEnd:
          type: integer
          minimum: 0
          maximum: 23

    ShortcutTokenSummary:
      type: object
      required: [id, label, createdAt, lastUsedAt]
      properties:
        id:
          type: integer
        label:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time

    MintShortcutTokenRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 60

    ShortcutTokenMinted:
      type: object
      required: [id, label, createdAt, token]
      properties:
        id:
          type: integer
        label:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: Full fqs_ secret — shown exactly once, store it in the Shortcut.

    ShortcutCaptureRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500

    ShortcutCaptureResponse:
      type: object
      required: [ok, id, title, dueDate, message]
      properties:
        ok:
          type: boolean
        id:
          type: integer
        title:
          type: string
        dueDate:
          type: string
        message:
          type: string

    ShortcutTodayPayload:
      type: object
      required: [count, message, quests]
      properties:
        count:
          type: integer
        message:
          type: string
        quests:
          type: object
          additionalProperties:
            type: integer
          description: Quest title → task id, duplicate titles suffixed " (2)".
