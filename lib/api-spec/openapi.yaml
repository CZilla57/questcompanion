        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leave outcome
          content:
            application/json:
              schema:
                type: object
                required: [left, ended]
                properties:
                  left: { type: boolean }
                  ended: { type: boolean }

  /body-double/rooms/{id}/wave:
    post:
      operationId: waveBodyDoubleRoom
      tags: [accountability]
      summary: Wave at the room (soft-capped; rate-limited waves are a quiet no-op)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Whether the wave was recorded
          content:
            application/json:
              schema:
                type: object
                required: [waved]
                properties:
                  waved: { type: boolean }

  /body-double/rooms/{id}/sprints:
    post:
      operationId: startBodyDoubleSprint
      tags: [accountability]
      summary: Start a shared sprint (one live sprint per room)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyDoubleSprintInput"
      responses:
        "201":
          description: The started sprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyDoubleSprint"

  /body-double/rooms/{id}/sprints/{sprintId}/finish:
    post:
      operationId: finishBodyDoubleSprint
      tags: [accountability]
      summary: Finish a sprint (validated wall-clock; exactly-once flat bonus to members present)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sprintId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completion outcome (soft no-op on races)
          content:
            application/json:
              schema:
                type: object
                required: [completed, xpAwarded, membersPaid]
                properties:
                  completed: { type: boolean }
                  xpAwarded: { type: integer }
                  membersPaid: { type: integer }

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top users ranked by points
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [alltime, weekly]
            default: alltime
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboard/my-week:
    get:
      operationId: getMyWeek
      tags: [leaderboard]
      summary: The viewer's week-so-far vs the same point last week
      responses:
        "200":
          description: Self-comparison over the viewer's local Monday-anchored weeks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyWeekComparison"

  /me/export:
    get:
      operationId: getMyExport
      tags: [users]
      summary: Download everything user-keyed as one JSON file
      responses:
        "200":
          description: Attachment JSON of the user's rows across all user-keyed tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"

  /me:
    delete:
      operationId: deleteMe
      tags: [users]
      summary: Permanently delete the account and every user-keyed row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "200":
          description: Account deleted; session destroyed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /shortcut-tokens:
    get:
      operationId: listShortcutTokens
      tags: [shortcuts]
      summary: List active Pocket Gate tokens (metadata only, never hashes)
      responses:
        "200":
          description: Active tokens, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShortcutTokenSummary"
    post:
      operationId: mintShortcutToken
      tags: [shortcuts]
      summary: Mint a Pocket Gate token — plaintext returned exactly once
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintShortcutTokenRequest"
      responses:
        "201":
          description: Minted; `token` appears only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortcutTokenMinted"

  /shortcut-tokens/{id}:
    delete:
      operationId: revokeShortcutToken
      tags: [shortcuts]
      summary: Revoke a Pocket Gate token (idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked (or was already gone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /shortcuts/capture:
    post:
      operationId: shortcutCapture
      tags: [shortcuts]
      summary: One-tap quest capture from the iPhone Shortcut (token or session auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortcutCaptureRequest"
      responses:
        "201":
          description: Quest created; `message` is notification-ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortcutCaptureResponse"

  /shortcuts/today:
    get:
      operationId: shortcutToday
      tags: [shortcuts]
      summary: Today's open quests as a title→id dictionary for Choose from List
      responses:
        "200":
          description: Dated-today plus incomplete anchored quests, capped at 25
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortcutTodayPayload"

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search for users by username
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /avatar:
    get:
      operationId: getAvatar
      tags: [avatar]
      summary: Get the current user's avatar profile and equipped gear
      responses:
        "200":
          description: Avatar profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarProfile"
    patch:
      operationId: updateAvatar
      tags: [avatar]
      summary: Update avatar color and/or class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUpdateInput"
      responses:
        "200":
          description: Updated avatar profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarProfile"

  /gear/store:
    get:
      operationId: getGearStore
      tags: [avatar]
      summary: List all gear items with ownership and affordability status
      responses:
        "200":
          description: Gear store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearStoreResponse"

  /gear/{id}/buy:
    post:
      operationId: buyGear
      tags: [avatar]
      summary: Purchase a gear item with coins (insufficiency is a gentle 200)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase result (purchased=false when short on coins)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyGearResult"
        "403":
          description: Level too low
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /gear/{id}/equip:
    post:
      operationId: equipGear
      tags: [avatar]
      summary: Equip a gear item (unequips same-slot item automatically)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /gear/{id}/unequip:
    post:
      operationId: unequipGear
      tags: [avatar]
      summary: Unequip a gear item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unequipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /battle/current:
    get:
      operationId: getBattleCurrent
      tags: [avatar]
      summary: Get this week's battle status
      responses:
        "200":
          description: Battle status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleStatus"

  /battle/enter:
    post:
      operationId: enterBattle
      tags: [avatar]
      summary: Enter this week's battle
      responses:
        "200":
          description: Battle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleResult"
        "409":
          description: Already fought this week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /world-boss/current:
    get:
      operationId: getWorldBossCurrent
      tags: [avatar]
      summary: Get this week's shared World Boss status
      responses:
        "200":
          description: World Boss status for the current viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldBossStatus"

  /world-boss/attack:
    post:
      operationId: attackWorldBoss
      tags: [avatar]
      summary: Deal this day's attack to the shared World Boss
      responses:
        "200":
          description: Attack outcome (may be a soft no-op if already attacked today or already felled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldBossAttackResult"

  /dopamine-rewards:
    get:
      operationId: getDopamineRewards
      tags: [users]
      summary: Get all dopamine rewards for the current user
      responses:
        "200":
          description: List of dopamine rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DopamineReward"
    post:
      operationId: createDopamineReward
      tags: [users]
      summary: Create a new dopamine reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DopamineRewardInput"
      responses:
        "201":
          description: Created reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DopamineReward"
        "400":
          description: Validation error or limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dopamine-rewards/{id}:
    delete:
      operationId: deleteDopamineReward
      tags: [users]
      summary: Delete a dopamine reward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coins:
    get:
      operationId: getCoins
      tags: [users]
      summary: Get the current user's coin balance
      responses:
        "200":
          description: Coin balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coins"

  /rewards-store:
    get:
      operationId: getRewardStoreItems
      tags: [users]
      summary: List the current user's real-life reward catalog
      responses:
        "200":
          description: Reward catalog with affordability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardStoreItem"
    post:
      operationId: createRewardStoreItem
      tags: [users]
      summary: Add a real-life reward priced by size tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardStoreItemInput"
      responses:
        "201":
          description: Created reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardStoreItem"
        "400":
          description: Validation error or limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /rewards-store/{id}:
    delete:
      operationId: deleteRewardStoreItem
      tags: [users]
      summary: Remove a reward from the catalog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /rewards-store/{id}/redeem:
    post:
      operationId: redeemRewardStoreItem
      tags: [users]
      summary: Spend coins to redeem a reward (gentle no-op if unaffordable)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Redemption outcome (redeemed true, or affordable false with remaining)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /mystery-box:
    get:
      operationId: getMysteryBox
      tags: [users]
      summary: Mystery Box state — cost and whether a pull is possible right now
      responses:
        "200":
          description: Mystery Box status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MysteryStatus"

  /mystery-box/open:
    post:
      operationId: openMysteryBox
      tags: [users]
      summary: Spend coins for a random reward from the Dopamine Menu (gentle no-op if unavailable)
      responses:
        "200":
          description: Pull outcome (opened with a reward + bonus, or a gentle reason it couldn't open)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MysteryResult"

  /stat-perks:
    get:
      operationId: getStatPerks
      tags: [users]
      summary: Coin-priced Stat Perks catalog with the current user's live state
      responses:
        "200":
          description: Balance and the perk catalog with per-user affordability/state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatPerks"

  /stat-perks/{id}/buy:
    post:
      operationId: buyStatPerk
      tags: [users]
      summary: Spend coins to buy a Stat Perk (gentle no-op if unaffordable or maxed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum: [xp_boost, focus_boost, streak_shield]
      responses:
        "200":
          description: Purchase outcome (purchased, or a gentle reason it couldn't buy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatPerkPurchaseResult"
        "404":
          description: Unknown perk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /calendar/heatmap:
    get:
      operationId: getCalendarHeatmap
      tags: [calendar]
      summary: Get completion heatmap data for the last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 90
          description: Number of days to return (default 90)
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapResponse"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, username, totalPoints, currentLevel, streakDays, createdAt, renameAvailableAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarColor:
          type: string
        totalPoints:
          type: integer
        weeklyPoints:
          type: integer
        currentLevel:
          type: integer
        levelName:
          type: string
        streakDays:
          type: integer
        longestStreak:
          type: integer
        pointsToNextLevel:
          type: integer
        createdAt:
          type: string
        renameAvailableAt:
          type: ["string", "null"]
          format: date-time
          description: Instant the next hero-name rename opens; null when renaming is available now.

    UserSummary:
      type: object
      required: [id, username, currentLevel, totalPoints]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarColor:
          type: string
        currentLevel:
          type: integer
        levelName:
          type: string
        totalPoints:
          type: integer
        streakDays:
          type: integer

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        avatarColor:
          type: string

    FeatureKey:
      type: string
      description: Gentle Door progressive-unlock feature groups. Most keys match a client nav group one-to-one; campaigns is the exception — it gates a tab inside the always-on quests nav group, not a nav group of its own.
      enum: [focus, hero, progress, allies, rewards, campaigns]

    UserStats:
      type: object
      required: [todayPoints, todayTasksTotal, todayTasksCompleted, allDayBonusEarned, weeklyPoints, totalPoints, currentLevel, levelName, streakDays, streakFreezes, pointsToNextLevel, pointsIntoLevel, recentActivity, onboardingComplete, unlockedFeatures]
      properties:
        todayPoints:
          type: integer
        todayTasksTotal:
          type: integer
        todayTasksCompleted:
          type: integer
        allDayBonusEarned:
          type: boolean
        weeklyPoints:
          type: integer
        totalPoints:
          type: integer
        currentLevel:
          type: integer
        levelName:
          type: string
        streakDays:
          type: integer
        streakFreezes:
          type: integer
          description: Number of streak freezes currently held (max 1)
        onboardingComplete:
          type: boolean
          description: Whether the user has completed hero name setup
        pointsToNextLevel:
          type: integer
        pointsIntoLevel:
          type: integer
          description: Points earned since entering the current level band (0 at the band's start)
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        unlockedFeatures:
          type: array
          description: Features visible to this user. Grandfathered accounts always get all five; locked features are invisible client-side (never teased).
          items:
            $ref: "#/components/schemas/FeatureKey"

    HeroStatus:
      type: object
      required: [stage, mood, lastFedAt, activity, companion]
      properties:
        stage:
          type: string
          enum: [well_fed, peckish, hungry, starving, fainted]
        mood:
          type: string
          description: Short mood line matching the stage
        lastFedAt:
          type: string
          format: date-time
        activity:
          type: object
          required: [id, text]
          description: Current ambient "hero life" vignette (rotates every ~3h)
          properties:
            id:
              type: string
            text:
              type: string
        companion:
          type: object
          required: [beat, line, bondTier, bondTierName, bondQuestsCompleted]
          description: Living Companion reaction (Act VI) — derived relational beat + bond
          properties:
            beat:
              type: string
              enum: [welcome_back, streak_milestone, rest_day, ambient, quiet]
            line:
              type: string
              description: Curated companion line; empty when beat is "quiet"
            bondTier:
              type: integer
            bondTierName:
              type: string
            bondQuestsCompleted:
              type: integer

    KingdomsResponse:
      type: object
      required: [worldResting, kingdoms, invitation]
      properties:
        worldResting:
          type: boolean
          description: True when recent activity is below the resting floor; the map renders one warm sleeping world rather than five neglect verdicts.
        kingdoms:
          type: array
          items:
            $ref: "#/components/schemas/KingdomState"
        invitation:
          oneOf:
            - $ref: "#/components/schemas/KingdomInvitation"
            - type: "null"

    KingdomState:
      type: object
      required: [id, name, isCapital, lifetimePoints, tier, tierName, liveliness]
      properties:
        id:
          type: string
          enum: [hearth, wellspring, forge, athenaeum, crossroads, capital]
        name:
          type: string
        isCapital:
          type: boolean
        lifetimePoints:
          type: integer
        tier:
          type: integer
        tierName:
          type: string
        liveliness:
          type: string
          enum: [dormant, stirring, steady, bustling]
          nullable: true
          description: >-
            Share of recent activity. Null for the capital, which is a
            cumulative lifetime total and has no share to report.

    KingdomInvitation:
      type: object
      required: [kingdomId, kingdomName]
      properties:
        kingdomId:
          type: string
        kingdomName:
          type: string

    Task:
      type: object
      required: [id, userId, title, points, completed, dueDate, priority, createdAt, category, categoryLabel, steps, difficulty, difficultyOfferable, bigSwing]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        points:
          type: integer
        completed:
          type: boolean
        completedAt:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        category:
          type: string
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
        categoryLabel:
          type: string
        createdAt:
          type: string
        estimatedMinutes:
          type: ["integer", "null"]
          description: Time the user estimated the quest would take (in minutes)
        actualMinutes:
          type: ["integer", "null"]
          description: Time the user actually spent on the quest (in minutes)
        isDailyFocus:
          type: boolean
          description: Whether this quest is pinned as a daily focus
        focusDate:
          type: ["string", "null"]
          description: The date (YYYY-MM-DD) this quest was pinned as focus
        isAnchored:
          type: boolean
          description: A no-deadline quest that stays visible until completed
        dueTime:
          type: ["string", "null"]
          description: Optional time of day (HH:mm, 24-hour)
        steps:
          type: array
          description: AI-generated first-step checklist attached to this quest
          items:
            $ref: "#/components/schemas/TaskStep"
        questlineId:
          type: ["integer", "null"]
          description: The questline this quest belongs to, or null
        recurringTaskId:
          type: ["integer", "null"]
          description: The recurring template this quest was spawned from, or null for a one-off
        difficulty:
          type: string
          enum: [easy, medium, hard]
          description: Current difficulty rung of the quest
        difficultyOfferable:
          type: boolean
          description: True when the app is gently offering a smaller version (never a shame signal; never a count)
        bigSwing:
          type: boolean
          description: True when this quest is a "big swing" (hard rung, high priority, or a 25+ minute estimate) — the kind steering routes into power windows

    FocusToggleInput:
      type: object
      required: [pin]
      properties:
        pin:
          type: boolean

    TaskStep:
      type: object
      required: [id, text, position, done]
      properties:
        id:
          type: integer
        text:
          type: string
        position:
          type: integer
        done:
          type: boolean

    StepToggleInput:
      type: object
      required: [done]
      properties:
        done:
          type: boolean

    ParseQuickAddInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        today:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: The client's local calendar date (YYYY-MM-DD), used to anchor relative date parsing in the client's timezone.

    ParsedQuickAdd:
      type: object
      required: [title]
      properties:
        title:
          type: string
        dueDate:
          type: ["string", "null"]
        dueTime:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, null]
        category:
          type: ["string", "null"]
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default, null]

    TranscribeResult:
      type: object
      required: [text]
      properties:
        text:
          type: string

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        points:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        dueDate:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Optional time estimate in minutes
        category:
          type: string
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
          description: Optional category override. Auto-detected from title if omitted.
        dueTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Optional time of day (HH:mm, 24-hour)
        isAnchored:
          type: boolean
          default: false
          description: Create a no-deadline anchored quest (dueDate is ignored)
        questlineId:
          type: ["integer", "null"]
          description: Assign the new quest to a questline (one-off quests only)
        clientKey:
          type: string
          minLength: 8
          maxLength: 64
          description: >-
            Client-generated idempotency key (a UUID). Two creates with the
            same key for the same user return the same task - the second
            responds 200 with the existing quest instead of creating a
            duplicate. Sent on every quick-add capture; offline replays reuse
            the capture's key.

    ApplyDifficultyInput:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [easy, medium, hard]

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        points:
          type: integer
          minimum: 1
          maximum: 100
        dueDate:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Time estimate (only updatable on incomplete tasks)
        actualMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Actual time spent (updatable on completed tasks too)
        category:
          type: string
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
        dueTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Optional time of day (HH:mm, 24-hour)
        isAnchored:
          type: boolean
          description: Toggle anchored (no-deadline) state; anchoring clears the due date
        questlineId:
          type: ["integer", "null"]
          description: Reassign the quest to a questline, or null to unlink (one-off quests only)
        viaSteering:
          type: boolean
          description: True when this update came from a power-window steering affordance; skips the forward-reschedule struggle signal (planning, not avoidance). Never persisted.

    TaskCompletionResult:
      type: object
      required: [task, pointsAwarded, bonusAwarded, bonusPoints, streakBonus, xpMultiplier, newTotalPoints, newLevel, leveledUp, newBadges, newlyUnlocked]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        pointsAwarded:
          type: integer
          description: Total XP awarded (base + streak bonus + all-day bonus)
        bonusAwarded:
          type: boolean
        bonusPoints:
          type: integer
          description: All-day completion bonus XP
        streakBonus:
          type: integer
          description: Extra XP from the streak difficulty multiplier
        xpMultiplier:
          type: number
          description: Streak-based multiplier applied to base XP (e.g. 1.05)
        newTotalPoints:
          type: integer
        newLevel:
          type: integer
        leveledUp:
          type: boolean
        newBadges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        gearReward:
          oneOf:
            - $ref: "#/components/schemas/GearRewardInfo"
            - type: "null"
        surpriseReward:
          oneOf:
            - $ref: "#/components/schemas/SurpriseReward"
            - type: "null"
          description: Random bonus reward triggered on ~12% of completions
        focusBonusAwarded:
          type: boolean
          description: Whether the all-3-focus-quests bonus was awarded
        focusBonusPoints:
          type: integer
          description: XP awarded for completing all 3 focus quests
        heroRevived:
          type: boolean
          description: True when this completion revived a fainted hero (fed after ≥7 days)
        companionReaction:
          oneOf:
            - type: string
            - type: "null"
          description: Companion's line for a just-happened bond tier-up or level-up, else null
        newlyUnlocked:
          type: array
          description: Gates crossed by this award (for the level-up dialog). Always empty for grandfathered users.
          items:
            $ref: "#/components/schemas/FeatureKey"

