openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FocusQuest API - ADHD gamified task tracker
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: users
    description: User profile and stats
  - name: tasks
    description: Task management
  - name: recurring
    description: Recurring task templates
  - name: badges
    description: Badges and achievements
  - name: accountability
    description: Accountability partner system
  - name: leaderboard
    description: Leaderboard and rankings
  - name: calendar
    description: Calendar heatmap data
  - name: focus
    description: Focus sessions and Pomodoro timer
  - name: questlines
    description: Grouping quests into goal-oriented questlines
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/stats:
    get:
      operationId: getMyStats
      tags: [users]
      summary: Get current user dashboard stats
      parameters:
        - name: tz
          in: query
          description: >-
            IANA timezone (e.g. "America/New_York") used to determine the user's
            local "today". Defaults to UTC when omitted or invalid.
          schema:
            type: string
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  /users/me/streak-freeze/buy:
    post:
      operationId: buyStreakFreeze
      tags: [users]
      summary: Spend 50 XP to buy a streak freeze (max 1 held at a time)
      responses:
        "200":
          description: Freeze purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakFreezeResult"
        "400":
          description: Not enough XP or already holding a freeze
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /users/me/xp-history:
    get:
      operationId: getMyXpHistory
      tags: [users]
      summary: Get daily XP earned for the past N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
        - name: tz
          in: query
          description: >-
            IANA timezone (e.g. "America/New_York") used to bucket XP by the
            user's local calendar day. Defaults to UTC when omitted or invalid.
          schema:
            type: string
      responses:
        "200":
          description: XP history per day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/XpDataPoint"

  /users/me/insights:
    get:
      operationId: getMyInsights
      tags: [users]
      summary: Get pattern insights for the current user
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
        - name: tz
          in: query
          description: >-
            IANA timezone (e.g. "America/New_York") used to bucket stats by the
            user's local calendar day and hour. Defaults to UTC when omitted or invalid.
          schema:
            type: string
      responses:
        "200":
          description: Insights data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"

  /tasks/recommend:
    get:
      operationId: getTaskRecommendation
      tags: [tasks]
      summary: Get a recommended next task using scoring logic
      parameters:
        - name: exclude
          in: query
          schema:
            type: string
          description: Comma-separated task IDs to exclude from consideration
      responses:
        "200":
          description: Recommended task or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecommendation"

  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List tasks for the current user
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by date (YYYY-MM-DD). Defaults to today.
        - name: completed
          in: query
          schema:
            type: ["boolean", "null"]
        - name: category
          in: query
          schema:
            type: string
            enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
          description: Filter by category
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/parse:
    post:
      operationId: parseQuickAdd
      tags: [tasks]
      summary: Parse a natural-language quick-add line into structured task fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseQuickAddInput"
      responses:
        "200":
          description: Parsed fields (does not create a task)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedQuickAdd"
        "429":
          description: Cooldown — too many parse requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Model or parse failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI parse not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task complete and award points
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completion result with points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCompletionResult"

  /recurring-tasks:
    get:
      operationId: getRecurringTasks
      tags: [recurring]
      summary: List all recurring task templates
      responses:
        "200":
          description: Recurring tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringTask"
    post:
      operationId: createRecurringTask
      tags: [recurring]
      summary: Create a recurring task template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskInput"
      responses:
        "201":
          description: Created recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"

  /recurring-tasks/{id}:
    get:
      operationId: getRecurringTask
      tags: [recurring]
      summary: Get a single recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"
    patch:
      operationId: updateRecurringTask
      tags: [recurring]
      summary: Update a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskUpdate"
      responses:
        "200":
          description: Updated recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"
    delete:
      operationId: deleteRecurringTask
      tags: [recurring]
      summary: Delete a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /recurring-tasks/{id}/toggle:
    post:
      operationId: toggleRecurringTask
      tags: [recurring]
      summary: Enable or disable a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"

  /tasks/{id}/uncomplete:
    post:
      operationId: uncompleteTask
      tags: [tasks]
      summary: Mark a task as incomplete (undo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/focus:
    patch:
      operationId: patchTaskFocus
      tags: [tasks]
      summary: Pin or unpin a task as a daily focus quest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusToggleInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation error (e.g. already 3 focus quests today)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/breakdown:
    post:
      operationId: breakdownTask
      tags: [tasks]
      summary: Generate an AI first-step breakdown for a quest (replaces existing steps)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Task with its new steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "429":
          description: Cooldown — too many breakdown requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Model or parse failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI breakdown not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/steps/{stepId}:
    patch:
      operationId: patchTaskStep
      tags: [tasks]
      summary: Toggle a breakdown step's done state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepToggleInput"
      responses:
        "200":
          description: Updated step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStep"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Step not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/steps:
    delete:
      operationId: deleteTaskSteps
      tags: [tasks]
      summary: Remove all breakdown steps for a quest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Steps removed

  /questlines:
    get:
      operationId: getQuestlines
      tags: [questlines]
      summary: List the current user's questlines with derived progress
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed]
          description: Optional status filter
      responses:
        "200":
          description: Questline list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Questline"
    post:
      operationId: createQuestline
      tags: [questlines]
      summary: Create a questline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestlineInput"
      responses:
        "201":
          description: Created questline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questline"

  /questlines/{id}:
    get:
      operationId: getQuestline
      tags: [questlines]
      summary: Get one questline with its quests
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Questline with quests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestlineDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateQuestline
      tags: [questlines]
      summary: Update a questline's title/description/color
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestlineUpdate"
      responses:
        "200":
          description: Updated questline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questline"
    delete:
      operationId: deleteQuestline
      tags: [questlines]
      summary: Delete a questline (its quests are unlinked, not deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /questlines/{id}/claim:
    post:
      operationId: claimQuestline
      tags: [questlines]
      summary: Claim the reward for a fully-completed questline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestlineClaimResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Not ready to claim, or already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /questlines/suggest-quests:
    post:
      operationId: suggestQuestlineQuests
      tags: [questlines]
      summary: Suggest quest titles for a goal (AI, creates nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestQuestlineQuestsInput"
      responses:
        "200":
          description: Suggested quest titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedQuestlineQuests"
        "429":
          description: Cooldown — too many suggestion requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Model or parse failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI drafting not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /focus-sessions/presets:
    get:
      operationId: getFocusPresets
      tags: [focus]
      summary: List Pomodoro presets
      responses:
        "200":
          description: Preset catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusPreset"

  /focus-sessions:
    get:
      operationId: listFocusSessions
      tags: [focus]
      summary: List recent focus sessions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent sessions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusSession"
    post:
      operationId: startFocusSession
      tags: [focus]
      summary: Start a focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFocusSessionInput"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "409":
          description: A session is already active

  /focus-sessions/active:
    get:
      operationId: getActiveFocusSession
      tags: [focus]
      summary: Get the current active session, or null
      responses:
        "200":
          description: The active session, or null
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/FocusSession"
                  - type: "null"

  /focus-sessions/{id}/interval:
    post:
      operationId: creditFocusInterval
      tags: [focus]
      summary: Credit a completed focus interval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusIntervalInput"
      responses:
        "200":
          description: Interval credited (xpDelta is 0 for a duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResult"

  /focus-sessions/{id}/complete:
    post:
      operationId: completeFocusSession
      tags: [focus]
      summary: End a focus session early
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusCompleteInput"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResult"

  /badges:
    get:
      operationId: getBadges
      tags: [badges]
      summary: List all available badges
      responses:
        "200":
          description: All badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /users/me/badges:
    get:
      operationId: getMyBadges
      tags: [badges]
      summary: Get badges earned by the current user
      responses:
        "200":
          description: Earned badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserBadge"

  /accountability/partners:
    get:
      operationId: getPartners
      tags: [accountability]
      summary: List accountability partners
      responses:
        "200":
          description: Partners list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partnership"
    post:
      operationId: sendPartnerRequest
      tags: [accountability]
      summary: Send an accountability partner request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerRequestInput"
      responses:
        "201":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partnership"

  /accountability/partners/{id}/accept:
    post:
      operationId: acceptPartnerRequest
      tags: [accountability]
      summary: Accept a partnership request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partnership accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partnership"

  /accountability/partners/{id}/decline:
    post:
      operationId: declinePartnerRequest
      tags: [accountability]
      summary: Decline or remove a partnership
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partnership declined/removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partnership"

  /accountability/partners/{id}/feed:
    get:
      operationId: getPartnerFeed
      tags: [accountability]
      summary: Get recent activity for a partner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partner activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /accountability/partners/{id}/detail:
    get:
      operationId: getPartnerDetail
      tags: [accountability]
      summary: Expanded ally profile (hero, badges, progress, milestones)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tz
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ally detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllyDetail"

  /accountability/partners/{id}/nudge:
    post:
      operationId: sendNudge
      tags: [accountability]
      summary: Send a poke or cheer to an ally
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NudgeInput"
      responses:
        "201":
          description: Nudge sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentNudge"

  /accountability/nudges:
    get:
      operationId: getNudges
      tags: [accountability]
      summary: List nudges received by the current user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Received nudges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nudge"

  /accountability/nudges/read:
    post:
      operationId: markNudgesRead
      tags: [accountability]
      summary: Mark received nudges as read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNudgesReadInput"
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                required: [success, updated]
                properties:
                  success: { type: boolean }
                  updated: { type: integer }

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top users ranked by points
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [alltime, weekly]
            default: alltime
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search for users by username
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /avatar:
    get:
      operationId: getAvatar
      tags: [avatar]
      summary: Get the current user's avatar profile and equipped gear
      responses:
        "200":
          description: Avatar profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarProfile"
    patch:
      operationId: updateAvatar
      tags: [avatar]
      summary: Update avatar color and/or class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUpdateInput"
      responses:
        "200":
          description: Updated avatar profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarProfile"

  /gear/store:
    get:
      operationId: getGearStore
      tags: [avatar]
      summary: List all gear items with ownership and affordability status
      responses:
        "200":
          description: Gear store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearStoreResponse"

  /gear/{id}/buy:
    post:
      operationId: buyGear
      tags: [avatar]
      summary: Purchase a gear item (deducts XP)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyGearResult"
        "403":
          description: Not enough XP or level too low
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /gear/{id}/equip:
    post:
      operationId: equipGear
      tags: [avatar]
      summary: Equip a gear item (unequips same-slot item automatically)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /gear/{id}/unequip:
    post:
      operationId: unequipGear
      tags: [avatar]
      summary: Unequip a gear item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unequipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /battle/current:
    get:
      operationId: getBattleCurrent
      tags: [avatar]
      summary: Get this week's battle status
      responses:
        "200":
          description: Battle status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleStatus"

  /battle/enter:
    post:
      operationId: enterBattle
      tags: [avatar]
      summary: Enter this week's battle
      responses:
        "200":
          description: Battle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleResult"
        "409":
          description: Already fought this week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dopamine-rewards:
    get:
      operationId: getDopamineRewards
      tags: [users]
      summary: Get all dopamine rewards for the current user
      responses:
        "200":
          description: List of dopamine rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DopamineReward"
    post:
      operationId: createDopamineReward
      tags: [users]
      summary: Create a new dopamine reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DopamineRewardInput"
      responses:
        "201":
          description: Created reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DopamineReward"
        "400":
          description: Validation error or limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dopamine-rewards/{id}:
    delete:
      operationId: deleteDopamineReward
      tags: [users]
      summary: Delete a dopamine reward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /calendar/heatmap:
    get:
      operationId: getCalendarHeatmap
      tags: [calendar]
      summary: Get completion heatmap data for the last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 90
          description: Number of days to return (default 90)
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapResponse"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, username, totalPoints, currentLevel, streakDays, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarColor:
          type: string
        totalPoints:
          type: integer
        weeklyPoints:
          type: integer
        currentLevel:
          type: integer
        levelName:
          type: string
        streakDays:
          type: integer
        longestStreak:
          type: integer
        pointsToNextLevel:
          type: integer
        createdAt:
          type: string

    UserSummary:
      type: object
      required: [id, username, currentLevel, totalPoints]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarColor:
          type: string
        currentLevel:
          type: integer
        levelName:
          type: string
        totalPoints:
          type: integer
        streakDays:
          type: integer

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        avatarColor:
          type: string

    UserStats:
      type: object
      required: [todayPoints, todayTasksTotal, todayTasksCompleted, allDayBonusEarned, weeklyPoints, totalPoints, currentLevel, levelName, streakDays, streakFreezes, pointsToNextLevel, pointsIntoLevel, recentActivity, onboardingComplete]
      properties:
        todayPoints:
          type: integer
        todayTasksTotal:
          type: integer
        todayTasksCompleted:
          type: integer
        allDayBonusEarned:
          type: boolean
        weeklyPoints:
          type: integer
        totalPoints:
          type: integer
        currentLevel:
          type: integer
        levelName:
          type: string
        streakDays:
          type: integer
        streakFreezes:
          type: integer
          description: Number of streak freezes currently held (max 1)
        onboardingComplete:
          type: boolean
          description: Whether the user has completed hero name setup
        pointsToNextLevel:
          type: integer
        pointsIntoLevel:
          type: integer
          description: Points earned since entering the current level band (0 at the band's start)
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    StreakFreezeResult:
      type: object
      required: [streakFreezes, totalPoints]
      properties:
        streakFreezes:
          type: integer
        totalPoints:
          type: integer

    Task:
      type: object
      required: [id, userId, title, points, completed, dueDate, priority, createdAt, category, categoryLabel, steps]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        points:
          type: integer
        completed:
          type: boolean
        completedAt:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        category:
          type: string
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
        categoryLabel:
          type: string
        createdAt:
          type: string
        estimatedMinutes:
          type: ["integer", "null"]
          description: Time the user estimated the quest would take (in minutes)
        actualMinutes:
          type: ["integer", "null"]
          description: Time the user actually spent on the quest (in minutes)
        isDailyFocus:
          type: boolean
          description: Whether this quest is pinned as a daily focus
        focusDate:
          type: ["string", "null"]
          description: The date (YYYY-MM-DD) this quest was pinned as focus
        isAnchored:
          type: boolean
          description: A no-deadline quest that stays visible until completed
        dueTime:
          type: ["string", "null"]
          description: Optional time of day (HH:mm, 24-hour)
        steps:
          type: array
          description: AI-generated first-step checklist attached to this quest
          items:
            $ref: "#/components/schemas/TaskStep"
        questlineId:
          type: ["integer", "null"]
          description: The questline this quest belongs to, or null

    FocusToggleInput:
      type: object
      required: [pin]
      properties:
        pin:
          type: boolean

    TaskStep:
      type: object
      required: [id, text, position, done]
      properties:
        id:
          type: integer
        text:
          type: string
        position:
          type: integer
        done:
          type: boolean

    StepToggleInput:
      type: object
      required: [done]
      properties:
        done:
          type: boolean

    ParseQuickAddInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        today:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: The client's local calendar date (YYYY-MM-DD), used to anchor relative date parsing in the client's timezone.

    ParsedQuickAdd:
      type: object
      required: [title]
      properties:
        title:
          type: string
        dueDate:
          type: ["string", "null"]
        dueTime:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, null]
        category:
          type: ["string", "null"]
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default, null]

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        points:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        dueDate:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Optional time estimate in minutes
        category:
          type: string
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
          description: Optional category override. Auto-detected from title if omitted.
        dueTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Optional time of day (HH:mm, 24-hour)
        isAnchored:
          type: boolean
          default: false
          description: Create a no-deadline anchored quest (dueDate is ignored)
        questlineId:
          type: ["integer", "null"]
          description: Assign the new quest to a questline (one-off quests only)

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        points:
          type: integer
          minimum: 1
          maximum: 100
        dueDate:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Time estimate (only updatable on incomplete tasks)
        actualMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Actual time spent (updatable on completed tasks too)
        category:
          type: string
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
        dueTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Optional time of day (HH:mm, 24-hour)
        isAnchored:
          type: boolean
          description: Toggle anchored (no-deadline) state; anchoring clears the due date
        questlineId:
          type: ["integer", "null"]
          description: Reassign the quest to a questline, or null to unlink (one-off quests only)

    TaskCompletionResult:
      type: object
      required: [task, pointsAwarded, bonusAwarded, bonusPoints, streakBonus, xpMultiplier, newTotalPoints, newLevel, leveledUp, newBadges]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        pointsAwarded:
          type: integer
          description: Total XP awarded (base + streak bonus + all-day bonus)
        bonusAwarded:
          type: boolean
        bonusPoints:
          type: integer
          description: All-day completion bonus XP
        streakBonus:
          type: integer
          description: Extra XP from the streak difficulty multiplier
        xpMultiplier:
          type: number
          description: Streak-based multiplier applied to base XP (e.g. 1.05)
        newTotalPoints:
          type: integer
        newLevel:
          type: integer
        leveledUp:
          type: boolean
        newBadges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        gearReward:
          oneOf:
            - $ref: "#/components/schemas/GearRewardInfo"
            - type: "null"
        surpriseReward:
          oneOf:
            - $ref: "#/components/schemas/SurpriseReward"
            - type: "null"
          description: Random bonus reward triggered on ~12% of completions
        focusBonusAwarded:
          type: boolean
          description: Whether the all-3-focus-quests bonus was awarded
        focusBonusPoints:
          type: integer
          description: XP awarded for completing all 3 focus quests
        heroRevived:
          type: boolean
          description: True when this completion revived a fainted hero (fed after ≥7 days)

    Questline:
      type: object
      required: [id, userId, title, status, total, done, ready, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed]
        total:
          type: integer
          description: Number of quests in this questline
        done:
          type: integer
          description: Number of completed quests
        ready:
          type: boolean
          description: True when active, non-empty, and every quest is done
        rewardXpAwarded:
          type: ["integer", "null"]
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    QuestlineInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        questTitles:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 120
          description: Optional quest titles to create (anchored) with the questline.

    QuestlineUpdate:
      type: object
      description: Partial update — every field optional.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]

    QuestlineDetail:
      type: object
      required: [questline, quests]
      properties:
        questline:
          $ref: "#/components/schemas/Questline"
        quests:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    QuestlineClaimResult:
      type: object
      required: [questline, xpAwarded, totalPoints, currentLevel, levelName, leveledUp]
      properties:
        questline:
          $ref: "#/components/schemas/Questline"
        xpAwarded:
          type: integer
        totalPoints:
          type: integer
        currentLevel:
          type: integer
        levelName:
          type: string
        leveledUp:
          type: boolean

    SuggestQuestlineQuestsInput:
      type: object
      required: [goal]
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 200

    SuggestedQuestlineQuests:
      type: object
      required: [quests]
      properties:
        quests:
          type: array
          items:
            type: string

    SurpriseReward:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [xp, gear]
          description: "xp: bonus XP awarded; gear: free item added to inventory"
        xpAmount:
          type: integer
          description: Bonus XP (present when type=xp)
        gear:
          oneOf:
            - $ref: "#/components/schemas/GearRewardInfo"
            - type: "null"
          description: Gear item awarded (present when type=gear)

    GearRewardInfo:
      type: object
      required: [gearItemId, name, slot, rarity, statPower, icon]
      properties:
        gearItemId:
          type: integer
        name:
          type: string
        slot:
          type: string
          enum: [weapon, helmet, armor, boots, accessory]
        rarity:
          type: string
          enum: [common, rare, epic, legendary]
        statPower:
          type: integer
        icon:
          type: string

    RecurringTask:
      type: object
      required: [id, userId, title, priority, daysOfWeek, timeOfDay, startDate, isActive, createdAt, currentStreak, longestStreak, totalCompletions, category, categoryLabel]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        daysOfWeek:
          type: array
          items:
            type: integer
          description: "0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat"
        timeOfDay:
          type: string
          description: "HH:MM format"
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        isActive:
          type: boolean
        estimatedPoints:
          type: integer
        category:
          type: string
          enum: [health, deep_work, learning, finance, admin, household, social, creative, self_care, errands, travel, default]
        categoryLabel:
          type: string
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        totalCompletions:
          type: integer
        lastCompletedDate:
          type: ["string", "null"]
        createdAt:
          type: string

    RecurringTaskInput:
      type: object
      required: [title, daysOfWeek, timeOfDay, startDate]
