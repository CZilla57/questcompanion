openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FocusQuest API - ADHD gamified task tracker
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: users
    description: User profile and stats
  - name: tasks
    description: Task management
  - name: recurring
    description: Recurring task templates
  - name: badges
    description: Badges and achievements
  - name: accountability
    description: Accountability partner system
  - name: leaderboard
    description: Leaderboard and rankings
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/stats:
    get:
      operationId: getMyStats
      tags: [users]
      summary: Get current user dashboard stats
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  /users/me/streak-freeze/buy:
    post:
      operationId: buyStreakFreeze
      tags: [users]
      summary: Spend 50 XP to buy a streak freeze (max 1 held at a time)
      responses:
        "200":
          description: Freeze purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakFreezeResult"
        "400":
          description: Not enough XP or already holding a freeze
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /users/me/xp-history:
    get:
      operationId: getMyXpHistory
      tags: [users]
      summary: Get daily XP earned for the past N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: XP history per day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/XpDataPoint"

  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List tasks for the current user
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by date (YYYY-MM-DD). Defaults to today.
        - name: completed
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task complete and award points
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completion result with points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCompletionResult"

  /recurring-tasks:
    get:
      operationId: getRecurringTasks
      tags: [recurring]
      summary: List all recurring task templates
      responses:
        "200":
          description: Recurring tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringTask"
    post:
      operationId: createRecurringTask
      tags: [recurring]
      summary: Create a recurring task template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskInput"
      responses:
        "201":
          description: Created recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"

  /recurring-tasks/{id}:
    get:
      operationId: getRecurringTask
      tags: [recurring]
      summary: Get a single recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"
    patch:
      operationId: updateRecurringTask
      tags: [recurring]
      summary: Update a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskUpdate"
      responses:
        "200":
          description: Updated recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"
    delete:
      operationId: deleteRecurringTask
      tags: [recurring]
      summary: Delete a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /recurring-tasks/{id}/toggle:
    post:
      operationId: toggleRecurringTask
      tags: [recurring]
      summary: Enable or disable a recurring task template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled recurring task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTask"

  /tasks/{id}/uncomplete:
    post:
      operationId: uncompleteTask
      tags: [tasks]
      summary: Mark a task as incomplete (undo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /badges:
    get:
      operationId: getBadges
      tags: [badges]
      summary: List all available badges
      responses:
        "200":
          description: All badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /users/me/badges:
    get:
      operationId: getMyBadges
      tags: [badges]
      summary: Get badges earned by the current user
      responses:
        "200":
          description: Earned badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserBadge"

  /accountability/partners:
    get:
      operationId: getPartners
      tags: [accountability]
      summary: List accountability partners
      responses:
        "200":
          description: Partners list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partnership"
    post:
      operationId: sendPartnerRequest
      tags: [accountability]
      summary: Send an accountability partner request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerRequestInput"
      responses:
        "201":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partnership"

  /accountability/partners/{id}/accept:
    post:
      operationId: acceptPartnerRequest
      tags: [accountability]
      summary: Accept a partnership request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partnership accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partnership"

  /accountability/partners/{id}/decline:
    post:
      operationId: declinePartnerRequest
      tags: [accountability]
      summary: Decline or remove a partnership
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partnership declined/removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partnership"

  /accountability/partners/{id}/feed:
    get:
      operationId: getPartnerFeed
      tags: [accountability]
      summary: Get recent activity for a partner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partner activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top users ranked by points
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [alltime, weekly]
            default: alltime
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search for users by username
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /avatar:
    get:
      operationId: getAvatar
      tags: [avatar]
      summary: Get the current user's avatar profile and equipped gear
      responses:
        "200":
          description: Avatar profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarProfile"
    patch:
      operationId: updateAvatar
      tags: [avatar]
      summary: Update avatar color and/or class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUpdateInput"
      responses:
        "200":
          description: Updated avatar profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarProfile"

  /gear/store:
    get:
      operationId: getGearStore
      tags: [avatar]
      summary: List all gear items with ownership and affordability status
      responses:
        "200":
          description: Gear store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearStoreResponse"

  /gear/{id}/buy:
    post:
      operationId: buyGear
      tags: [avatar]
      summary: Purchase a gear item (deducts XP)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyGearResult"
        "403":
          description: Not enough XP or level too low
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /gear/{id}/equip:
    post:
      operationId: equipGear
      tags: [avatar]
      summary: Equip a gear item (unequips same-slot item automatically)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /gear/{id}/unequip:
    post:
      operationId: unequipGear
      tags: [avatar]
      summary: Unequip a gear item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unequipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /battle/current:
    get:
      operationId: getBattleCurrent
      tags: [avatar]
      summary: Get this week's battle status
      responses:
        "200":
          description: Battle status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleStatus"

  /battle/enter:
    post:
      operationId: enterBattle
      tags: [avatar]
      summary: Enter this week's battle
      responses:
        "200":
          description: Battle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleResult"
        "409":
          description: Already fought this week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, username, totalPoints, currentLevel, streakDays, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarColor:
          type: string
        totalPoints:
          type: integer
        weeklyPoints:
          type: integer
        currentLevel:
          type: integer
        levelName:
          type: string
        streakDays:
          type: integer
        longestStreak:
          type: integer
        pointsToNextLevel:
          type: integer
        createdAt:
          type: string

    UserSummary:
      type: object
      required: [id, username, currentLevel, totalPoints]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarColor:
          type: string
        currentLevel:
          type: integer
        levelName:
          type: string
        totalPoints:
          type: integer
        streakDays:
          type: integer

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        avatarColor:
          type: string

    UserStats:
      type: object
      required: [todayPoints, todayTasksTotal, todayTasksCompleted, allDayBonusEarned, weeklyPoints, totalPoints, currentLevel, levelName, streakDays, streakFreezes, pointsToNextLevel, recentActivity, onboardingComplete]
      properties:
        todayPoints:
          type: integer
        todayTasksTotal:
          type: integer
        todayTasksCompleted:
          type: integer
        allDayBonusEarned:
          type: boolean
        weeklyPoints:
          type: integer
        totalPoints:
          type: integer
        currentLevel:
          type: integer
        levelName:
          type: string
        streakDays:
          type: integer
        streakFreezes:
          type: integer
          description: Number of streak freezes currently held (max 1)
        onboardingComplete:
          type: boolean
          description: Whether the user has completed hero name setup
        pointsToNextLevel:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    StreakFreezeResult:
      type: object
      required: [streakFreezes, totalPoints]
      properties:
        streakFreezes:
          type: integer
        totalPoints:
          type: integer

    Task:
      type: object
      required: [id, userId, title, points, completed, dueDate, priority, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        points:
          type: integer
        completed:
          type: boolean
        completedAt:
          type: ["string", "null"]
        dueDate:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        createdAt:
          type: string

    TaskInput:
      type: object
      required: [title, dueDate]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        points:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        dueDate:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
          default: medium

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        points:
          type: integer
          minimum: 1
          maximum: 100
        dueDate:
          type: string
        priority:
          type: string
          enum: [low, medium, high]

    TaskCompletionResult:
      type: object
      required: [task, pointsAwarded, bonusAwarded, bonusPoints, streakBonus, xpMultiplier, newTotalPoints, newLevel, leveledUp, newBadges]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        pointsAwarded:
          type: integer
          description: Total XP awarded (base + streak bonus + all-day bonus)
        bonusAwarded:
          type: boolean
        bonusPoints:
          type: integer
          description: All-day completion bonus XP
        streakBonus:
          type: integer
          description: Extra XP from the streak difficulty multiplier
        xpMultiplier:
          type: number
          description: Streak-based multiplier applied to base XP (e.g. 1.05)
        newTotalPoints:
          type: integer
        newLevel:
          type: integer
        leveledUp:
          type: boolean
        newBadges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        gearReward:
          oneOf:
            - $ref: "#/components/schemas/GearRewardInfo"
            - type: "null"

    GearRewardInfo:
      type: object
      required: [gearItemId, name, slot, rarity, statPower, icon]
      properties:
        gearItemId:
          type: integer
        name:
          type: string
        slot:
          type: string
          enum: [weapon, helmet, armor, boots, accessory]
        rarity:
          type: string
          enum: [common, rare, epic, legendary]
        statPower:
          type: integer
        icon:
          type: string

    RecurringTask:
      type: object
      required: [id, userId, title, priority, daysOfWeek, timeOfDay, startDate, isActive, createdAt, currentStreak, longestStreak, totalCompletions]
      properties:
        id:
          type: integer
        userId:
