<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Sprite Harness (dev)</title>
    <style>
      body { margin: 0; background: #0f1117; color: #e6e6e6; font-family: system-ui, sans-serif; }
      h1 { font-size: 1rem; font-weight: 600; }
      section { padding: 1rem 1.25rem; border-bottom: 1px solid #222634; }
      .row { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-end; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
      .cap { font-size: 0.7rem; color: #9aa4b2; }
      button { background: #2b3245; color: #e6e6e6; border: 1px solid #3a445c; border-radius: 6px; padding: 0.5rem 0.9rem; cursor: pointer; font-size: 0.85rem; }
      button:hover { background: #354063; }
      .grid { display: grid; grid-template-columns: repeat(8, 48px); gap: 8px; }
    </style>
  </head>
  <body>
    <div id="harness"></div>
    <script type="module" src="/src/hero-harness.tsx"></script>
  </body>
</html>
