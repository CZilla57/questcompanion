name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm --filter @workspace/api-server run build

      - run: pnpm --filter @workspace/focusquest run build
        env:
          PORT: "5173"
          BASE_PATH: "/"

  # Builds the native iOS app. The app now lives on main (merged via #103), so
  # this job runs on pushes to main and PRs targeting it, giving the iOS source
  # CI coverage alongside the code it now carries.
  ios:
    # Run on pushes to main (github.ref_name == 'main') and PRs targeting main.
    # (On a pull_request, github.ref_name is the merge ref, so we match on
    # base_ref for PRs.)
    if: github.base_ref == 'main' || github.ref_name == 'main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Config.local.xcconfig may be absent on a fresh checkout; the tracked
      # Config.xcconfig placeholder is enough to compile.
      - name: Ensure local xcconfig exists
        run: test -f ios/Config.local.xcconfig || cp ios/Config.xcconfig ios/Config.local.xcconfig

      # Compile for the simulator (no signing, no device). -skipMacroValidation
      # trusts the SPM macros the same way the headless dev build does.
      - name: Build FocusQuest
        run: |
          xcodebuild build \
            -project ios/FocusQuest.xcodeproj \
            -scheme FocusQuest \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
